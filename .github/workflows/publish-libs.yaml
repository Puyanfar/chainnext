name: Publish libs

# npm publishing is disabled. Chainnext ships JS assets inside the PyPI
# package via publish.yaml. This workflow is kept from upstream so it can
# be re-enabled later. See RELENG.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test publishing)'
        required: false
        default: false
        type: boolean
  # Not triggered on GitHub releases while npm publishing is skipped.

permissions: read-all

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-slim
    steps:
      - name: Validate publishing branch and destination package index
        run: |
          if [[ "${{ github.ref_name }}" != "main" && "${{ github.event_name }}" != "release" ]]; then
            if [[ "${{ inputs.dry_run }}" != "true" ]]; then
              echo "❌ Error: Only build from main branch or release tag can be published to npm registry."
              echo "Please check 'Dry run (test publishing)' when running from branch: ${{ github.ref_name }}"
              exit 1
            fi
          fi
          echo "✅ Validation passed"
  ci:
    needs: [validate]
    uses: ./.github/workflows/ci.yaml
    secrets: inherit
  build-n-publish:
    name: Upload libs release to npm registry
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.

      - name: Build react-client
        run: pnpm --filter @chainlit/react-client build

      - name: Skip npm publish
        run: |
          echo "npm publishing is disabled for Chainnext."
          echo "JS assets (frontend and copilot) ship inside the PyPI package via publish.yaml."
          echo "See RELENG.md."
          echo "To re-enable: restore the release trigger and run:"
          echo "  pnpm publish --recursive --no-git-checks"
