name: E2E tests

on:
  workflow_call:
    inputs:
      e2e_parallel_shards:
        description: Number of parallel E2E shards per OS.
        type: number
        default: 5

permissions: read-all

jobs:
  prepare:
    name: Validate inputs and compute shard matrix
    runs-on: ubuntu-slim
    outputs:
      indexes: ${{ steps.shard-indexes.outputs.indexes }}
    steps:
      - name: Validate e2e_parallel_shards
        run: |
          n="${{ inputs.e2e_parallel_shards }}"
          if ! [[ "$n" =~ ^[0-9]+$ ]] || [[ "$n" -lt 1 ]]; then
            echo "❌ Error: e2e_parallel_shards must be at least 1, got: $n"
            exit 1
          fi
          echo "✅ Validation passed"
      - id: shard-indexes
        name: Compute shard indexes
        run: |
          json=$(jq -nc --argjson n "${{ inputs.e2e_parallel_shards }}" '[range(1; $n + 1)]')
          echo "indexes=$json" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        containers: ${{ fromJSON(needs.prepare.outputs.indexes) }}
    name: ${{ matrix.os }}-${{ matrix.containers }}
    env:
      BACKEND_DIR: ./backend
      # Single path for actions/cache on Linux + Windows (default Cypress dirs differ by OS).
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cypress-cache
    steps:
      - uses: actions/checkout@v6
      - name: Cache Cypress binary
        uses: actions/cache@v5
        if: always()
        with:
          path: .cypress-cache
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.
      # Cypress v14's install/verify consults the OS-default location (e.g.
      # %LOCALAPPDATA%\Cypress\Cache on Windows) rather than CYPRESS_CACHE_FOLDER,
      # so `cypress install` can short-circuit as "already installed" while the
      # path `cypress run` actually looks up (CYPRESS_CACHE_FOLDER) stays empty.
      # We verify the exact path cypress run will use and force a fresh install
      # only when it is missing. Keep the binary layout in sync with the
      # `cypress` version in package.json (read dynamically below).
      #
      # NOTE: CYPRESS_INSTALL_BINARY is the *version* to install in Cypress 14,
      # NOT a force flag. Setting it to "1" made Cypress try to download
      # https://download.cypress.io/desktop/1 (404). It must stay UNSET so the
      # CLI installs the version matching the npm package. With CYPRESS_CACHE_FOLDER
      # set (job env) and the folder clean, `cypress install` downloads into
      # .cypress-cache (verified locally on Linux 14.5.3).
      - name: Ensure Cypress binary is installed
        run: |
          set -e
          CY_VER=$(node -p "require('cypress/package.json').version")
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_PATH=".cypress-cache/${CY_VER}/Cypress/Cypress.exe"
          else
            BIN_PATH=".cypress-cache/${CY_VER}/Cypress/Cypress"
          fi
          if [ -f "$BIN_PATH" ]; then
            echo "✅ Cypress binary present at $BIN_PATH (restored from cache)"
          else
            echo "⬇️  Binary missing — forcing a fresh install into CYPRESS_CACHE_FOLDER"
            rm -rf .cypress-cache
            unset CYPRESS_INSTALL_BINARY
            pnpm exec cypress install
            test -f "$BIN_PATH" || {
              echo "❌ Cypress binary still missing after forced install at $BIN_PATH"
              exit 1
            }
          fi
        shell: bash
      - uses: ./.github/actions/uv-python-install
        name: Install Python, uv and Python & pnpm (uv does it automatically) dependencies
        with:
          working-directory: ${{ env.BACKEND_DIR }}
          uv-args: --extra tests
      - name: Run tests
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          SPLIT: ${{ inputs.e2e_parallel_shards }}
          SPLIT_INDEX1: ${{ matrix.containers }}
        run: pnpm test:e2e
        shell: bash
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('cypress/screenshots/**') != ''
        with:
          name: cypress-screenshots-${{ matrix.os }}-${{ matrix.containers }}
          path: cypress/screenshots
