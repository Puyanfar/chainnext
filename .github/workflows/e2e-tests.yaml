name: E2E tests

on:
  workflow_call:
    inputs:
      e2e_parallel_shards:
        description: Number of parallel E2E shards per OS.
        type: number
        default: 5

permissions: read-all

jobs:
  prepare:
    name: Validate inputs and compute shard matrix
    runs-on: ubuntu-slim
    outputs:
      indexes: ${{ steps.shard-indexes.outputs.indexes }}
    steps:
      - name: Validate e2e_parallel_shards
        run: |
          n="${{ inputs.e2e_parallel_shards }}"
          if ! [[ "$n" =~ ^[0-9]+$ ]] || [[ "$n" -lt 1 ]]; then
            echo "❌ Error: e2e_parallel_shards must be at least 1, got: $n"
            exit 1
          fi
          echo "✅ Validation passed"
      - id: shard-indexes
        name: Compute shard indexes
        run: |
          json=$(jq -nc --argjson n "${{ inputs.e2e_parallel_shards }}" '[range(1; $n + 1)]')
          echo "indexes=$json" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        containers: ${{ fromJSON(needs.prepare.outputs.indexes) }}
    name: ${{ matrix.os }}-${{ matrix.containers }}
    env:
      BACKEND_DIR: ./backend
      # Cypress uses each OS's default binary cache dir (no CYPRESS_CACHE_FOLDER
      # override): Linux ~/.cache/Cypress, Windows %LOCALAPPDATA%\Cypress\Cache.
      # The "Cache Cypress binary" steps below snapshot those default dirs.
    steps:
      - uses: actions/checkout@v6
      # Cache the OS-default Cypress binary dir so the multi-minute download
      # becomes a cache hit on subsequent runs. actions/cache@v5 expands `~` to
      # the runner user's home on both OSes. `if: ... && always()` keeps the
      # save-on-failure behavior: the first successful install is captured even
      # if "Run tests" later fails, so retries restore instead of re-downloading.
      - name: Cache Cypress binary (Linux)
        if: runner.os == 'Linux' && always()
        id: cache-linux
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-Linux-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Cypress binary (Windows)
        if: runner.os == 'Windows' && always()
        id: cache-windows
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Cypress\Cache
          key: cypress-Windows-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Log Cypress cache restore status
        shell: bash
        run: |
          echo "::group::📦 Cypress binary cache — restore status"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "OS=Windows  cache-step=cache-windows  restored=${{ steps.cache-windows.outputs.cache-hit }}  key=cypress-Windows-${{ hashFiles('pnpm-lock.yaml') }}"
          else
            echo "OS=Linux    cache-step=cache-linux    restored=${{ steps.cache-linux.outputs.cache-hit }}  key=cypress-Linux-${{ hashFiles('pnpm-lock.yaml') }}"
          fi
          echo "restored=true  → binary should already be on disk (fast path)"
          echo "restored=false → fresh download expected in 'Ensure Cypress binary is installed'"
          echo "::endgroup::"
      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.
      # Cypress installs its binary to the OS-default cache dir:
      #   Linux:   ~/.cache/Cypress
      #   Windows: %LOCALAPPDATA%\Cypress\Cache
      # We do NOT set CYPRESS_CACHE_FOLDER (overriding the install path is what
      # broke Windows — see cypress-io/cypress#2417). Instead we verify the exact
      # binary path `cypress run` will resolve and run `cypress install` only when
      # it is missing. CYPRESS_INSTALL_BINARY must stay UNSET: in Cypress 14 it is
      # the *version* to install, not a force flag.
      #
      # Logging: every stage is wrapped in ::group:: banners and a failure prints
      # a full diagnostic block (env, paths, cache state, dir listing, cypress
      # cache path/list) so a future failure is self-explanatory in the CI log.
      - name: Ensure Cypress binary is installed
        run: |
          set -e
          CY_VER=$(node -p "require('cypress/package.json').version")
          if [ "${{ runner.os }}" = "Windows" ]; then
            OS_NAME="Windows"
            CACHE_DIR="$LOCALAPPDATA/Cypress/Cache"
            BIN_PATH="$CACHE_DIR/$CY_VER/Cypress/Cypress.exe"
          else
            OS_NAME="Linux"
            CACHE_DIR="$HOME/.cache/Cypress"
            BIN_PATH="$CACHE_DIR/$CY_VER/Cypress/Cypress"
          fi

          # --- diagnostic helper: print everything needed to debug a failure ---
          diag() {
            echo "::group::🔎 Cypress install diagnostics"
            echo "--- environment ---"
            echo "OS (runner.os)        : $OS_NAME"
            echo "CYPRESS_CACHE_FOLDER  : '${CYPRESS_CACHE_FOLDER:-<unset>}'"
            echo "CYPRESS_INSTALL_BINARY: '${CYPRESS_INSTALL_BINARY:-<unset>}'"
            echo "HOME                  : '${HOME:-<unset>}'"
            echo "LOCALAPPDATA          : '${LOCALAPPDATA:-<unset>}'"
            echo "npm_config_cypress_cache_folder       : '${npm_config_cypress_cache_folder:-<unset>}'"
            echo "npm_config_cypress_install_binary     : '${npm_config_cypress_install_binary:-<unset>}'"
            echo "--- expected paths ---"
            echo "CY_VER   : $CY_VER"
            echo "CACHE_DIR: $CACHE_DIR"
            echo "BIN_PATH : $BIN_PATH"
            echo "--- cypress's own view of the cache ---"
            echo "\$ cypress cache path"
            (pnpm exec cypress cache path 2>&1 || echo "   (cypress cache path failed)") | sed 's/^/   /'
            echo "\$ cypress cache list"
            (pnpm exec cypress cache list 2>&1 || echo "   (cypress cache list failed)") | sed 's/^/   /'
            echo "--- contents of CACHE_DIR ($CACHE_DIR) ---"
            if [ -d "$CACHE_DIR" ]; then
              ls -laR "$CACHE_DIR" 2>/dev/null | sed 's/^/   /' || echo "   (ls failed)"
            else
              echo "   (dir does not exist)"
            fi
            echo "--- does the expected binary exist? ---"
            if [ -f "$BIN_PATH" ]; then
              echo "   YES: $BIN_PATH"
              ls -la "$BIN_PATH" | sed 's/^/   /'
            else
              echo "   NO:  $BIN_PATH"
            fi
            echo "::endgroup::"
          }

          echo "::group::🌐 Cypress install — environment"
          echo "OS (runner.os)        : $OS_NAME"
          echo "Cypress npm version   : $CY_VER"
          echo "CYPRESS_CACHE_FOLDER  : '${CYPRESS_CACHE_FOLDER:-<unset>}' (must be <unset>)"
          echo "CYPRESS_INSTALL_BINARY: '${CYPRESS_INSTALL_BINARY:-<unset>}' (must be <unset>)"
          echo "CACHE_DIR (expected)  : $CACHE_DIR"
          echo "BIN_PATH  (expected)  : $BIN_PATH"
          echo "::endgroup::"

          # Sanity: the override must not be active — it is what broke Windows.
          if [ -n "${CYPRESS_CACHE_FOLDER:-}" ]; then
            echo "::warning::CYPRESS_CACHE_FOLDER is set to '$CYPRESS_CACHE_FOLDER'. This workflow relies on the OS-default cache dir; the override may cause the binary to land somewhere 'cypress run' does not look."
          fi

          if [ -f "$BIN_PATH" ]; then
            echo "::group::✅ Cypress binary already present (cache hit — no install needed)"
            ls -la "$BIN_PATH" | sed 's/^/   /'
            echo "Verifying the binary with 'cypress verify' ..."
            echo "::endgroup::"
            if ! pnpm exec cypress verify; then
              echo "::error::cypress verify FAILED for an already-present binary at $BIN_PATH"
              diag
              exit 1
            fi
            echo "✅ Cypress binary verified at $BIN_PATH"
          else
            echo "::group::⬇️  Cypress binary missing — installing to the default cache"
            echo "CACHE_DIR: $CACHE_DIR"
            echo "This will download the $CY_VER binary (~150-200 MB). Watch for 'Downloading Cypress' / 'Unzipping Cypress' progress below."
            echo "::endgroup::"
            unset CYPRESS_INSTALL_BINARY
            # DEBUG gives verbose cypress:cli output (resolved cache dir, download
            # URL, unzip target) so a silent failure is no longer silent.
            if ! DEBUG=cypress:cli* pnpm exec cypress install; then
              echo "::error::'cypress install' returned a non-zero exit code"
              diag
              exit 1
            fi
            if [ -f "$BIN_PATH" ]; then
              echo "✅ Cypress binary installed at $BIN_PATH"
              ls -la "$BIN_PATH" | sed 's/^/   /'
            else
              echo "::error::'cypress install' finished but the binary is NOT at $BIN_PATH"
              diag
              exit 1
            fi
          fi
        shell: bash
      - name: Confirm binary before running tests
        shell: bash
        run: |
          echo "::group::🚦 Pre-test binary check"
          CY_VER=$(node -p "require('cypress/package.json').version")
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_PATH="$LOCALAPPDATA/Cypress/Cache/$CY_VER/Cypress/Cypress.exe"
          else
            BIN_PATH="$HOME/.cache/Cypress/$CY_VER/Cypress/Cypress"
          fi
          if [ -f "$BIN_PATH" ]; then
            echo "✅ Binary present: $BIN_PATH"
          else
            echo "::error::Binary MISSING right before 'Run tests': $BIN_PATH"
            echo "CYPRESS_CACHE_FOLDER='${CYPRESS_CACHE_FOLDER:-<unset>}'"
            ls -laR "$LOCALAPPDATA/Cypress/Cache" 2>/dev/null | sed 's/^/   /' || true
            ls -laR "$HOME/.cache/Cypress" 2>/dev/null | sed 's/^/   /' || true
            exit 1
          fi
          echo "::endgroup::"
      - uses: ./.github/actions/uv-python-install
        name: Install Python, uv and Python & pnpm (uv does it automatically) dependencies
        with:
          working-directory: ${{ env.BACKEND_DIR }}
          uv-args: --extra tests
      - name: Run tests
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          SPLIT: ${{ inputs.e2e_parallel_shards }}
          SPLIT_INDEX1: ${{ matrix.containers }}
        run: pnpm test:e2e
        shell: bash
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('cypress/screenshots/**') != ''
        with:
          name: cypress-screenshots-${{ matrix.os }}-${{ matrix.containers }}
          path: cypress/screenshots
