packages:
  - frontend/
  - libs/react-client/
  - libs/copilot/

# Settings formerly in .npmrc / package.json "pnpm" field (ignored by pnpm >= 12).
sharedWorkspaceLockfile: false
sideEffectsCache: false
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '@types*'

# Dependency build scripts pnpm is allowed to run.
allowBuilds:
  '@swc/core': true
  cypress: true
  es5-ext: false
  esbuild: true

# Security overrides for vulnerable transitive dependencies that cannot be fixed
# by upgrading a direct dependency. Keep this list minimal: every entry must be
# justified below and is verified against all four lockfiles by
# `pnpm check-overrides`. Remove an entry once its parent no longer pulls the
# vulnerable range.
overrides:
  # cypress-split > find-cypress-specs pins minimatch ^10 (needs >= 11.0.1).
  minimatch@>=10.0.0 <11.0.1: '>=11.0.1 <12.0.0'
  # remark-math > micromark-extension-math pins katex ^0.16 (needs >= 0.18.2).
  katex@>=0.11.0 <0.18.2: '>=0.18.2 <0.19.0'
  # Storybook 8 > @storybook/addon-actions pins uuid ^9 (needs >= 11.1.1).
  uuid@<11.1.1: '>=11.1.1 <12.0.0'
  # Storybook 8 > @storybook/react-vite pins plugin 0.5.0, which depends on
  # vulnerable glob/minimatch. 0.9.1 uses tinyglobby instead.
  '@joshwooding/vite-plugin-react-docgen-typescript': 0.9.1
