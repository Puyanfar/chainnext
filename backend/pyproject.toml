[project]
name = "chainnext"
dynamic = ["version"]
keywords = [
    "LLM",
    "Agents",
    "MCP",
    "gen ai",
    "chat ui",
    "chatbot ui",
    "openai",
    "copilot",
    "langchain",
    "conversational ai",
    "chainlit",
    "chainnext",
]
description = "Chainnext: a Chainlit-compatible framework for building conversational AI."
authors = [
    { name = "Willy Douhard" },
    { name = "Dan Andre Constantini" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
classifiers = [
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Web Environment",
]

dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "literalai>=0.1.300,<0.2.0",
    "dataclasses_json>=0.6.7,<0.7.0",
    "fastapi>=0.165.0,<1.0.0",
    "starlette>=1.10.0,<2.0.0",
    "uvicorn>=0.54.0,<1.0.0",
    "python-socketio>=5.18.1,<6.0.0",
    "aiofiles>=25.1.0,<26.0.0",
    "syncer>=2.0.3,<3.0.0",
    "asyncer>=0.0.20,<0.1.0",
    "mcp>=1.30.0,<2.0.0",
    "nest-asyncio2>=1.7.4,<2.0.0",
    "click>=8.5.1,<9.0.0",
    "pydantic>=2.14.4,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "watchfiles>=1.3.0,<2.0.0",
    "filetype>=1.2.0,<2.0.0",
    "lazify>=0.4.0,<0.5.0",
    "packaging>=26.3,<27",
    "python-multipart>=0.0.34,<1.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "pydantic-settings>=2.16.3,<3.0.0"
]

[dependency-groups]
dev = [
    "hatchling>=1.33.0,<2.0.0",
    "ruff>=0.17.6,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/Puyanfar/chainnext"
Documentation = "https://github.com/Puyanfar/chainnext"
Repository = "https://github.com/Puyanfar/chainnext"

# Console script stays `chainlit` so existing apps and docs keep working.
# The PyPI distribution name above is `chainnext`; the import package is `chainlit`.
[project.scripts]
chainlit = "chainlit.cli:cli"

[project.optional-dependencies]
tests = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.5.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "openai>=3.57.0,<4.0.0",
    "langchain>=1.5.2,<2.0.0",
    "llama-index>=0.14.26,<1.0.0",
   # "semantic-kernel>=1.47.0,<2.0.0",   # the latest available version at the time (v1.47.0) is not compatible with pydantic v2.14. Check the 'docs/semantic-kernel.md'
    "tenacity>=9.2.1,<10.0.0",
    "transformers>=5.24.0,<6.0.0",
    "matplotlib>=3.11.2,<4.0.0",
    "plotly>=7.1.0,<8.0.0",
    "slack_bolt>=1.30.0,<2.0.0",
    "discord.py>=2.7.1,<3.0.0",
    "botbuilder-core>=4.17.1,<5.0.0",
    "aiosqlite>=0.22.1,<1.0.0",
    "pandas>=3.1.1,<4.0.0",
    "polars>=2.1.0,<3.0.0",
    "moto>=5.2.5,<6.0.0",
]
mypy = [
    "mypy>=2.4.1,<3.0.0",
    "types-requests>=2.33.0.20261030,<3.0.0",
    "types-aiofiles>=25.1.0.20261107,<26.0.0",
    "mypy-boto3-dynamodb>=1.44.0,<2.0.0",
    "pandas-stubs>=3.1.0.261029,<4.0.0",
]
custom-data = [
    "asyncpg>=0.32.0,<1.0.0",
    "SQLAlchemy>=2.1.9,<3.0.0",
    "boto3>=1.44.9,<2.0.0",
    "azure-identity>=1.27.0,<2.0.0",
    "azure-storage-file-datalake>=12.26.1,<13.0.0",
    "azure-storage-blob>=12.31.1,<13.0.0",
    "google-cloud-storage>=3.17.1,<4.0.0",
]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "chainlit/frontend/**/*",
  "chainlit/copilot/**/**/"
]

[tool.hatch.build.hooks.custom]
path = "build.py"

[tool.hatch.build.targets.sdist]
artifacts = [
    "chainlit/frontend/dist/**/*",
    "chainlit/copilot/dist/**/*"
]

[tool.hatch.build.targets.wheel]
packages = ["chainlit"]
artifacts = [
    "chainlit/frontend/dist/**/*",
    "chainlit/copilot/dist/**/*"
]

[tool.hatch.version]
path = "chainlit/version.py"
